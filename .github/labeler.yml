# Label configuration — informational only.
# Standard GitHub labels (enhancement, bug, documentation) are applied by
# the labeler workflow via github-script, matching the PR title against
# Conventional Commits prefixes (feat:, fix:, docs:).
# Chore, test, refactor, build and perf PRs intentionally get no label.
#
# File-based and branch-based rules are intentionally omitted:
#   - File-based rules cause multiple labels per PR → duplicate release notes.
#   - Branch names follow issue-N/description, not feat/fix/... prefixes.
