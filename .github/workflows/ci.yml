name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  SQLITE_VERSION: "3490100"
  SQLITE_YEAR: "2025"
  ZIG_VERSION: "0.16.0"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            ~/AppData/Local/zig
          key: zig-cache-${{ matrix.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-cache-${{ matrix.os }}-

      - name: Download SQLite amalgamation
        shell: bash
        run: |
          mkdir -p lib
          curl -fsSL "https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-amalgamation-${{ env.SQLITE_VERSION }}.zip" -o sqlite.zip
          python3 -c "
          import zipfile, os
          os.makedirs('lib', exist_ok=True)
          with zipfile.ZipFile('sqlite.zip') as z:
              for f in z.namelist():
                  if f.endswith(('sqlite3.c', 'sqlite3.h')):
                      data = z.read(f)
                      with open('lib/' + os.path.basename(f), 'wb') as out:
                          out.write(data)
          print('SQLite amalgamation ready')
          "

      - name: Download libyaml amalgamation
        shell: bash
        run: |
          mkdir -p lib/yaml
          curl -fsSL "https://github.com/yaml/libyaml/archive/refs/tags/0.2.5.tar.gz" -o /tmp/yaml-0.2.5.tar.gz
          tar -xzf /tmp/yaml-0.2.5.tar.gz -C /tmp
          cp /tmp/libyaml-0.2.5/include/yaml.h lib/yaml/yaml.h
          cp /tmp/libyaml-0.2.5/src/yaml_private.h lib/yaml/yaml_private.h
          cp /tmp/libyaml-0.2.5/src/api.c lib/yaml/api.c
          cp /tmp/libyaml-0.2.5/src/parser.c lib/yaml/parser.c
          cp /tmp/libyaml-0.2.5/src/scanner.c lib/yaml/scanner.c
          cp /tmp/libyaml-0.2.5/src/reader.c lib/yaml/reader.c
          cp /tmp/libyaml-0.2.5/src/writer.c lib/yaml/writer.c
          cp /tmp/libyaml-0.2.5/src/loader.c lib/yaml/loader.c
          cat > lib/yaml/zig_compat.c <<'ZIG_COMPAT_EOF'
          /*
           * Zig 0.16 + MSVC + libyaml compatibility shim.
           *
           * On Windows MSVC, the secure CRT functions wcscat_s/wcscpy_s are declared
           * in <wchar.h>, which gets pulled in transitively via lib/yaml/yaml.h's
           * <string.h> include. libyaml never calls them, so Zig 0.16's C-to-Zig
           * wrapper marks them as unused local consts and fails to compile. The same
           * functions do not exist in glibc/BSD libc, so Linux and macOS are
           * unaffected.
           *
           * This file force-references wcscat_s/wcscpy_s in a constructor function
           * that runs at program startup, so the Zig wrapper sees them as used.
           * On non-MSVC the silencer is a no-op kept alive by __attribute__((used)).
           * ponytail: zig-0.16 windows MSVC workaround
           */
          #include "yaml_private.h"

          #if defined(_MSC_VER)
          #  pragma comment(linker, "/include:_zig_yaml_compat_init")
          #  pragma init_seg(".CRT$XCU")
          static void _zig_yaml_compat_silencer(void) {
              /* volatile forces the compiler to actually compute the function
               * addresses; (void) cast alone can be optimized away. */
              volatile void *p1 = (void *)wcscat_s;
              volatile void *p2 = (void *)wcscpy_s;
              (void)p1; (void)p2;
          }
          __declspec(noinline) static void _zig_yaml_compat_init(void) {
              _zig_yaml_compat_silencer();
          }
          #elif defined(__GNUC__) || defined(__clang__)
          __attribute__((used, constructor))
          static void _zig_yaml_compat_silencer(void) {
              /* No-op on non-MSVC platforms; the attributes keep this in the
               * binary and let it run harmlessly at startup. */
              (void)0;
          }
          #endif
          ZIG_COMPAT_EOF
          echo "libyaml 0.2.5 ready"

      - name: Build
        run: zig build -Dbundle-sqlite=true -Doptimize=ReleaseSafe

      - name: Unit tests (csv.zig)
        run: zig build unit-test -Dbundle-sqlite=true

      - name: Integration tests (build.zig)
        if: runner.os != 'Windows'
        run: zig build test

      - name: Integration test (Unix)
        if: runner.os != 'Windows'
        run: |
          result=$(printf 'name,age\nAlice,30\nBob,25\nCarol,35' | ./zig-out/bin/sql-pipe "SELECT name FROM t WHERE CAST(age AS INT) > 27")
          expected=$'Alice\nCarol'
          if [ "$result" != "$expected" ]; then
            echo "FAIL: expected '$expected', got '$result'"
            exit 1
          fi
          echo "PASS"

      - name: Integration test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = "name,age`nAlice,30`nBob,25`nCarol,35" | .\zig-out\bin\sql-pipe.exe "SELECT name FROM t WHERE CAST(age AS INT) > 27"
          $expected = @("Alice", "Carol")
          $lines = $result -split "`n" | Where-Object { $_ -ne "" }
          if ($lines.Count -ne 2 -or $lines[0].Trim() -ne "Alice" -or $lines[1].Trim() -ne "Carol") {
            Write-Error "FAIL: unexpected output: $result"
            exit 1
          }
          Write-Host "PASS"
